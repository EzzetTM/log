name: SkyWorldClans source audit
on:
  push:
    paths:
      - "SkyWorldClans-1.0.0-source.zip"
      - ".github/workflows/unpack-source.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  extract-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Extract source archive
        id: extract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          python3 - <<'PY'
          import pathlib, zipfile
          root = pathlib.Path("extracted").resolve()
          conflicts = []
          with zipfile.ZipFile("SkyWorldClans-1.0.0-source.zip") as archive:
              entries = []
              directories = set()
              for item in archive.infolist():
                  name = item.filename.replace("\\", "/").lstrip("/")
                  parts = pathlib.PurePosixPath(name).parts
                  if not parts or ".." in parts:
                      conflicts.append(f"UNSAFE {item.filename}")
                      continue
                  entries.append((item, name))
                  if item.is_dir():
                      directories.add(name.rstrip("/"))
                  for index in range(1, len(parts)):
                      directories.add("/".join(parts[:index]))
              for item, name in entries:
                  target = (root / name).resolve()
                  if target != root and root not in target.parents:
                      conflicts.append(f"UNSAFE {item.filename}")
                      continue
                  if name.rstrip("/") in directories:
                      if target.exists() and not target.is_dir():
                          conflicts.append(f"DIR_COLLISION {item.filename} -> {target}")
                          continue
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      if target.parent.exists() and not target.parent.is_dir():
                          conflicts.append(f"PARENT_COLLISION {item.filename} -> {target.parent}")
                          continue
                      target.parent.mkdir(parents=True, exist_ok=True)
                      if target.exists() and target.is_dir():
                          conflicts.append(f"FILE_DIR_COLLISION {item.filename} -> {target}")
                          continue
                      with archive.open(item) as source, target.open("wb") as destination:
                          destination.write(source.read())
          if conflicts:
              pathlib.Path("extracted/ZIP_PATH_CONFLICTS.txt").write_text("\n".join(conflicts), encoding="utf-8")
              print("\n".join(conflicts))
          PY
          POM="$(find extracted -type f -name pom.xml -print -quit)"
          if [ -z "$POM" ]; then
            echo "No pom.xml found in source archive" | tee extracted/AUDIT_STATUS.txt
            exit 2
          fi
          echo "pom=$POM" >> "$GITHUB_OUTPUT"
          echo "Found Maven project: $POM" | tee extracted/AUDIT_STATUS.txt
      - name: Apply audited safety fixes
        if: steps.extract.outcome == 'success'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          
          root = Path("extracted")
          
          # Fix reward coordinator initialization order.
          plugin = root / "src/main/java/com/skyworldclans/SkyWorldClansPlugin.java"
          s = plugin.read_text(encoding="utf-8")
          old_line = ("            clanRewardCoordinator = new ClanRewardCoordinator(getClanStore(), getClanStore(),\n"
                      "                    vaultEconomyBridge, java.time.Clock.systemUTC(), java.util.UUID::randomUUID);\n")
          if s.count(old_line) != 1:
              raise SystemExit("Expected exactly one early reward coordinator construction")
          s = s.replace(old_line, "", 1)
          needle = "        vaultEconomyBridge = discoverVaultEconomyBridge();\n"
          if s.count(needle) != 1:
              raise SystemExit("Could not locate Vault discovery point")
          s = s.replace(needle, needle +
                        "        clanRewardCoordinator = new ClanRewardCoordinator(getClanStore(), getClanStore(),\n"
                        "                vaultEconomyBridge, java.time.Clock.systemUTC(), java.util.UUID::randomUUID);\n", 1)
          
          # Fail closed if moderation state cannot be read.
          new_method = """    public boolean isChatMuted(java.util.UUID playerId) {
                  if (clanRuntime == null || playerId == null) return true;
                  try {
                      ClanAdministrationService admin = clanAdministrationService;
                      ClanModerationService moderation = clanModerationService;
                      if (admin == null || moderation == null) return true;
                      if (admin.isFunctionBlocked(playerId, "CLAN_CHAT", java.time.Instant.now())) return true;
                      var clan = getClanStore().findByPlayerId(playerId).orElse(null);
                      return clan != null && moderation.isChatMuted(clan.id(), playerId);
                  } catch (RuntimeException exception) {
                      getLogger().log(Level.SEVERE, "Could not read clan chat mute for " + playerId, exception);
                      return true;
                  }
              }
          """
          s, n = re.subn(r"(?ms)^    public boolean isChatMuted\(.*?(?=^    /\*\* Administrative function blocks)", new_method, s)
          if n != 1:
              raise SystemExit(f"Expected one isChatMuted method, replaced {n}")
          plugin.write_text(s, encoding="utf-8")
          
          # Enforce anonymous-report redaction at the service boundary.
          admin = root / "src/main/java/com/skyworldclans/admin/ClanAdministrationService.java"
          s = admin.read_text(encoding="utf-8")
          new_reports = """    public List<SqliteClanStore.ClanReport> reports(Level level, String status, int limit) {
                  if (level == Level.NONE) return List.of();
                  return store.findClanReports(status, limit).stream()
                          .map(report -> report.anonymous() && level != Level.OWNER
                                  ? new SqliteClanStore.ClanReport(report.reportId(), report.clanId(),
                                          new UUID(0L, 0L), "anonymous", true, report.category(), report.reason(),
                                          report.status(), report.assignedTo(), report.createdAt(), report.updatedAt())
                                  : report)
                          .toList();
              }
          """
          s, n = re.subn(r"(?ms)^    public List<SqliteClanStore\.ClanReport> reports\(Level level, String status, int limit\) \{.*?^    \}", new_reports.rstrip(), s)
          if n != 1:
              raise SystemExit(f"Expected one reports method, replaced {n}")
          admin.write_text(s, encoding="utf-8")
          
          # Add regression assertions for list-based anonymous-report access.
          test = root / "src/test/java/com/skyworldclans/admin/ClanAdministrationServiceTest.java"
          s = test.read_text(encoding="utf-8")
          marker = "                    .filter(report -> report.anonymous()).findFirst().orElseThrow().reportId();\n"
          addition = marker + """            var listedModeratorReport = service.reports(ClanAdministrationService.Level.MODERATOR, null, 50)
                              .stream().filter(report -> report.reportId().equals(anonymousId)).findFirst().orElseThrow();
                      assertEquals("anonymous", listedModeratorReport.authorName());
                      assertEquals(new UUID(0L, 0L), listedModeratorReport.authorId());
                      var listedOwnerReport = service.reports(ClanAdministrationService.Level.OWNER, null, 50)
                              .stream().filter(report -> report.reportId().equals(anonymousId)).findFirst().orElseThrow();
                      assertEquals("Hidden", listedOwnerReport.authorName());
                      assertEquals(id(3), listedOwnerReport.authorId());
          """
          if s.count(marker) != 1:
              raise SystemExit("Could not locate anonymous report test insertion point")
          test.write_text(s.replace(marker, addition, 1), encoding="utf-8")
          
          # Owner-only permission is not inherited by every OP.
          plugin_yml = root / "src/main/resources/plugin.yml"
          s = plugin_yml.read_text(encoding="utf-8")
          pattern = r"(?m)(^  skyworldclans\.admin\.owner:\n  description:.*\n  default: )op$"
          s, n = re.subn(pattern, r"\g<1>false", s)
          if n != 1:
              raise SystemExit(f"Expected one owner permission default, replaced {n}")
          plugin_yml.write_text(s, encoding="utf-8")
          
          # Correct stale documentation around resolved decisions and the actual residual blockers.
          commands = root / "docs/COMMANDS_AND_PERMISSIONS.md"
          s = commands.read_text(encoding="utf-8")
          s = s.replace("### Административные (только консоль)", "### Административные команды и панель")
          s = s.replace("крупные (>100 000) заблокированы до решения вопроса №4.",
                        "крупные (>100 000) требуют одобрения лидера; недельная квота расходуется при одобрении (3 за 7 дней).")
          tick = chr(96)
          old_row = "| " + tick + "skyworldclans.admin.owner" + tick + " | Владелец: полный доступ панели, личность автора жалобы | " + tick + "op" + tick
          new_row = "| " + tick + "skyworldclans.admin.owner" + tick + " | Владелец: полный доступ панели, личность автора жалобы | " + tick + "false" + tick
          s = s.replace(old_row, new_row)
          s = s.replace("- Дом: одна бесплатная основная точка (дополнительные — вопрос владельца №2).",
                        "- Дом: первая точка бесплатна; вторая покупается лидером за 200 000 из банка; максимум 2 точки.")
          commands.write_text(s, encoding="utf-8")
          
          report = root / "docs/IMPLEMENTATION_REPORT.md"
          s = report.read_text(encoding="utf-8").replace("426 тестов", "445 тестов")
          a = s.index("## 3. Ограничения")
          b = s.index("## 4. Внешние зависимости", a)
          new_section = """## 3. Остаточные блокеры и незавершённая приёмка
          
          | Блокер | Текущее безопасное поведение | Что требуется |
          |---|---|---|
          | SWCoin | Все операции отключены; списания и начисления не имитируются | Подтверждённый публичный API SkyWorldCoins с атомарными операциями |
          | Регистрация турниров | Создание и настройка доступны; открытие регистрации заблокировано | Утвердить цену и правила оплаты |
          | CombatLog после рестарта | INTERRUPTED_REVIEW, автоматических санкций нет | Решение владельца по вопросу №6 |
          | Закрытие дела после предупреждений | Дело эскалируется лидеру через 24 часа; автоматического наказания нет | Решение владельца по вопросу №9 |
          | Живой Paper 1.21.11 | Maven-сборка и unit-тесты пройдены; GUI и серверные события не принимались на живом сервере | Общая приёмка на отдельном тестовом сервере |
          | Внешние интеграции | Контракты и fail-closed ветки проверены тестами | Runtime-проверка Vault, WorldGuard и FlectonePulse с реальными плагинами |
          
          """
          s = s[:a] + new_section + s[b:]
          report.write_text(s, encoding="utf-8")
          
          print("Applied audited safety fixes and documentation corrections.")
          
          PY
      - name: Run Maven tests and package
        id: maven
        if: steps.extract.outcome == 'success'
        shell: bash
        run: |
          set +e
          POM="${{ steps.extract.outputs.pom }}"
          PROJECT_DIR="$(dirname "$POM")"
          cd "$PROJECT_DIR"
          mvn -B -ntp clean verify
          RESULT=$?
          echo "MAVEN_EXIT_CODE=$RESULT" >> "$GITHUB_ENV"
          echo "Maven clean verify exit code: $RESULT" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - name: Collect audit status
        if: always()
        shell: bash
        run: |
          mkdir -p audit-output extracted
          echo "Maven exit code: ${MAVEN_EXIT_CODE:-not-run}" > audit-output/AUDIT_STATUS.txt
          find extracted -type f \( -name '*.java' -o -name '*.yml' -o -name '*.yaml' -o -name '*.md' -o -name 'pom.xml' \) | sort > audit-output/SOURCE_FILE_LIST.txt
          find extracted -type f \( -path '*/target/surefire-reports/*' -o -path '*/target/failsafe-reports/*' -o -name '*.jar' \) -exec cp --parents {} audit-output/ \; 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skyworldclans-source-and-audit
          path: |
            extracted/
            audit-output/
          if-no-files-found: error
          retention-days: 3
      - name: Fail workflow if Maven verification failed
        if: always() && steps.maven.outcome == 'success'
        shell: bash
        run: |
          if [ "${MAVEN_EXIT_CODE:-1}" != "0" ]; then
            exit 1
          fi
